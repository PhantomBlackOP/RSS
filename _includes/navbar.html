<nav aria-label="Archive navigation">
  {% if include.prev_url %}
    <a href="{{ include.prev_url | relative_url }}">← Previous</a>
  {% endif %}
  {% assign latest_week = site.posts | first %}
  {% if latest_week %}
    <a href="{{ latest_week.url | relative_url }}">Latest weekly</a>
  {% endif %}
  <a href="{{ '/archive/' | relative_url }}">Weekly archive</a>
  <a href="{{ '/monthly/' | relative_url }}">Monthly Dailies</a>
  <a href="{{ '/gallery/' | relative_url }}">Art gallery</a>
  <a href="{{ '/top20/' | relative_url }}">Top 20 Dailies</a>
  <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  {% if include.next_url %}
    <a href="{{ include.next_url | relative_url }}">Next →</a>
  {% endif %}
</nav>
