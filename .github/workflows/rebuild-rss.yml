name: Rebuild RSS from Sitemap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/rebuild_from_sitemap.py'
      - 'scripts/rank_dailies.py'
      - 'data/daily_reviews.json'
      - 'README.md'
      - '.github/workflows/rebuild-rss.yml'
  schedule:
    - cron: '0 6 * * *' # after the 03:00 UTC Sitemap refresh

permissions:
  contents: write

concurrency:
  group: sitemap-rss-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RSS
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate from Sitemap XML only
        run: python scripts/rebuild_from_sitemap.py
      - name: Commit complete archive replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _posts monthly gallery top20 _includes/zine-hero.html index.md archive.md monthly_index.md
          if git diff --cached --quiet; then
            echo 'Sitemap unchanged; RSS archives already current.'
            exit 0
          fi
          git commit -m 'Refresh RSS archives and galleries from Zine Sitemap'
          git pull --rebase origin main
          git push origin HEAD:main
